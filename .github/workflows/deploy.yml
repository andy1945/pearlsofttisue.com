name: build-and-deploy-to-cpanel
on:
    push:
        branches: ["main"]

permissions:
    contents: read

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Deploy to cPanel via FTP/FTPS
              uses: SamKirkland/FTP-Deploy-Action@v4.3.6
              with:
                  server: ${{ secrets.FTP_HOST }}
                  username: ${{ secrets.FTP_USERNAME }}
                  password: ${{ secrets.FTP_PASSWORD }}
                  port: ${{ secrets.FTP_PORT }}
                  protocol: ${{ secrets.FTP_PROTOCOL }}
                  local-dir: ./.output/public/   # <--- Updated to point to Nitro's static export folder
                  server-dir: /                  # or public_html/ depending on your cPanel document root
                  dry-run: false